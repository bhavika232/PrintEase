<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintDesk — New Print Request</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-plain">

  <!-- Navbar -->
  <nav class="navbar">
    <a href="dashboard.html" class="navbar-brand">
      <span>🖨️</span> PrintDesk
    </a>
    <div class="navbar-links">
      <span style="font-size:0.85rem;color:var(--text-light);padding:6px 8px;">
        👤 <span id="nav-user-name"></span>
      </span>
      <a href="dashboard.html">Dashboard</a>
      <a href="status.html">My Orders</a>
      <button id="logout-btn">Logout</button>
    </div>
  </nav>

  <!-- Page content -->
  <div class="container-sm">

    <div class="page-header">
      <h2>📤 New Print Request</h2>
      <p>Fill in the details below to submit a document for printing.</p>
    </div>

    <!-- Alert Box -->
    <div id="upload-alert" class="alert alert-error"></div>

    <!-- Print Request Form -->
    <div class="card">
      <form id="upload-form" autocomplete="off">

        <!-- File Name -->
        <div class="form-group">
          <label for="file-name">📄 Document / File Name</label>
          <input
            type="text"
            id="file-name"
            placeholder="e.g. Assignment_1.pdf, Report_Final.docx"
            required
          />
        </div>

        <!-- Number of Copies -->
        <div class="form-group">
          <label for="copies">🔢 Number of Copies</label>
          <input
            type="number"
            id="copies"
            placeholder="Enter number of copies"
            min="1"
            max="500"
            value="1"
            required
          />
        </div>

        <!-- Color Selection (radio buttons styled as cards) -->
        <div class="form-group">
          <label>🎨 Print Type</label>
          <div class="radio-group">

            <label class="radio-option">
              <input type="radio" name="color" value="B&W" checked />
              ⚫ Black &amp; White
            </label>

            <label class="radio-option">
              <input type="radio" name="color" value="Color" />
              🌈 Color Print
            </label>

          </div>
        </div>

        <!-- Page Range -->
        <div class="form-group">
          <label for="page-range">📑 Page Range</label>
          <input
            type="text"
            id="page-range"
            placeholder="e.g. 1-10, 3,5,7 or leave blank for All"
          />
          <small style="font-size:0.78rem;color:var(--text-light);margin-top:4px;display:block;">
            Leave empty to print all pages.
          </small>
        </div>

        <hr class="divider" />

        <!-- Action Buttons -->
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary" style="flex:1;min-width:140px;">
            🖨️ Submit Request
          </button>
          <a href="dashboard.html" class="btn btn-secondary" style="flex:1;min-width:140px;">
            ← Go Back
          </a>
        </div>

      </form>
    </div><!-- end .card -->

    <!-- Info box -->
    <div style="
      margin-top:16px;
      background: var(--purple-light);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size:0.84rem;
      color: var(--purple-dark);
      display:flex;
      gap:10px;
      align-items:flex-start;
    ">
      <span style="font-size:1.1rem;">ℹ️</span>
      <span>
        Your request will be received as <strong>Pending</strong> and processed by the admin.
        You can track it on the <a href="status.html" style="color:var(--purple-main);font-weight:600;">My Orders</a> page.
      </span>
    </div>

  </div><!-- end .container-sm -->

  <script src="js/app.js"></script>
</body>
</html>
