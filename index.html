<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintDesk — Login</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- =====================================================
       Aurora Canvas Background
       The canvas sits fixed behind everything (z-index: 0)
       and is animated by initAurora() in app.js
       ===================================================== -->
  <canvas id="aurora-canvas"></canvas>

  <!-- =====================================================
       Page Wrapper — centers the auth card
       ===================================================== -->
  <div class="page-wrapper">

    <div class="auth-card">

      <!-- Logo & Title -->
      <div class="auth-logo">
        <div class="logo-icon">🖨️</div>
        <h1>PrintDesk</h1>
        <p>Online Document Printing System</p>
      </div>

      <!-- Alert Box (shown on error by JS) -->
      <div id="login-alert" class="alert alert-error"></div>

      <!-- Login Form -->
      <form id="login-form" autocomplete="off">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Sign In →
        </button>

      </form>

      <hr class="divider" />

      <!-- Register Link -->
      <p class="auth-footer">
        Don't have an account?
        <a href="register.html">Create one</a>
      </p>

      <!-- Demo credentials hint -->
      <p class="auth-footer" style="margin-top:8px;font-size:0.78rem;color:#c4b5fd">
        Admin: admin@printdesk.com / admin123
      </p>

    </div>

  </div><!-- end .page-wrapper -->

  <script src="js/app.js"></script>
</body>
</html>
