<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrintDesk — Register</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Soft plain background (no aurora on register page) -->
  <style>
    body { background: var(--bg-soft); }
    .page-wrapper { background: none; }
  </style>
</head>
<body>

  <div class="page-wrapper" style="padding: 40px 16px;">

    <div class="auth-card">

      <!-- Logo & Title -->
      <div class="auth-logo">
        <div class="logo-icon">📝</div>
        <h1>Create Account</h1>
        <p>Join PrintDesk to manage your print jobs</p>
      </div>

      <!-- Alert Box -->
      <div id="reg-alert" class="alert alert-error"></div>

      <!-- Registration Form -->
      <form id="register-form" autocomplete="off">

        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input
            type="text"
            id="reg-name"
            placeholder="Your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input
            type="email"
            id="reg-email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <input
            type="password"
            id="reg-password"
            placeholder="Min. 6 characters"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input
            type="password"
            id="reg-confirm"
            placeholder="Repeat your password"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Create Account
        </button>

      </form>

      <hr class="divider" />

      <p class="auth-footer">
        Already have an account?
        <a href="index.html">Sign in</a>
      </p>

    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
